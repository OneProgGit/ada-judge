[package]
name = "ada-judge"
version = "1.0.0-alpha2"
edition = "2024"
rust-version = "1.98.0"

[dependencies]
axum.workspace = true
tokio.workspace = true
sqlx.workspace = true
models.workspace = true
tools.workspace = true
database.workspace = true
apalis-redis.workspace = true
apalis.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
aj-models.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
argon2 = { version = "0.6.0" }
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
zip-extensions = "0.14.1"
toml = "1.1.5+spec-1.1.0"
uuid = { version = "1.26.0", features = ["v4"] }
tokio-util = { version = "0.7.19", features = ["io"] }
dashmap = "6.2.1"

[workspace]
members = [
    "crates/submissions-judger",
    "crates/aj-models",
    "crates/models",
    "crates/tools",
    "crates/database",
]
resolver = "3"

[workspace.dependencies]
submissions-judger = { path = "crates/submissions-judger" }
aj-models = { path = "crates/aj-models", features = ["sqlx"] }
models = { path = "crates/models" }
tools = { path = "crates/tools" }
database = { path = "crates/database" }
axum = { version = "0.8.9", features = ["json", "multipart", "ws"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "process", "macros"] }
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "chrono", "macros"] }
apalis-redis = "1.0.0-rc.8"
apalis = "1.0.0-rc.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
