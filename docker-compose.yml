services:
  postgres:
    image: postgres:18.3-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "1111:5432"
    volumes:
      - pgdata:/var/lib/postgresql/18/docker
  redis:
    image: redis:8-alpine
    restart: always
    environment:
      REDIS_USER: ${REDIS_USER}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_USER_PASSWORD: ${REDIS_USER_PASSWORD}
    ports:
      - "2222:6379"
    command: >
      sh -c '
        mkdir -p /usr/local/etc/redis &&
        echo "bind 0.0.0.0" > /usr/local/etc/redis/redis.conf &&
        echo "requirepass $REDIS_PASSWORD" >> /usr/local/etc/redis/redis.conf &&
        echo "appendonly yes" >> /usr/local/etc/redis/redis.conf &&
        echo "appendfsync everysec" >> /usr/local/etc/redis/redis.conf &&
        echo "user default on nopass ~* +@all" > /usr/local/etc/redis/users.acl &&
        echo "user $REDIS_USER on >$REDIS_USER_PASSWORD ~* +@all" >> /usr/local/etc/redis/users.acl &&
        redis-server /usr/local/etc/redis/redis.conf --aclfile /usr/local/etc/redis/users.acl
      '
    volumes:
      - redisdata:/data
  sandbox:
    build: ./containers/sandbox
  submissions-judger:
    build:
      dockerfile: ./containers/app/Dockerfile
      context: .
      target: submissions-judger
    deploy:
      replicas: 10
    depends_on:
      - postgres
      - redis
      - sandbox
    environment:
      POSTGRES_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://${REDIS_USER}:${REDIS_USER_PASSWORD}@redis:6379/0
      HOST_RUNS_DIR: ${PWD}
      SANDBOX_IMAGE: sandbox-runner
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./submissions_envs:/submissions_envs
      - ./problems:/problems
  main:
    build:
      dockerfile: ./containers/app/Dockerfile
      context: .
      target: main
    depends_on:
      - postgres
      - redis
      - sandbox
    environment:
      POSTGRES_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://${REDIS_USER}:${REDIS_USER_PASSWORD}@redis:6379/0
      HOST_RUNS_DIR: ${PWD}
      MASTER_PASSWORD: ${MASTER_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP_HOURS: ${JWT_EXP_HOURS}
    ports:
      - "4444:4444"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./submissions_envs:/submissions_envs
      - ./problems:/problems
volumes:
  pgdata:
  redisdata:
